<!DOCTYPE html>
<html>
<head>
    <title>Lap Timer</title>
    <link href="https://fonts.googleapis.com/css?family=Inconsolata:text=0123456798" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
</head>
<body>

<div class="main-layout">
    <header>
        <div id="elapsed">
            {% include 'elapsed.html' %}
        </div>
        <div id="startLights">
            <div class="startLight"></div>
            <div class="startLight"></div>
            <div class="startLight"></div>
            <div class="startLight"></div>
            <div class="startLight"></div>
        </div>
    </header>

    <main id="lap_times">

        {% include 'lap_times.html' %}

    </main>
    <footer>
        <button onclick="startTimer()">Start Timer</button>
        <button onclick="continueTimer()">Continue Timer</button>
        <button onclick="stopTimer()">Stop Timer</button>
        {% for lane in lanes %}<button onclick="lap({{ lane.number }})">Lap {{ lane.number }}</button>
        {% endfor %}        <button onclick="refreshValues()">Refresh</button>
        <button onclick="reset()">Reset</button>
    </footer>
</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
